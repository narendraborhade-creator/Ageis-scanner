name: Deploy Aegis Safe Browser to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --legacy-peer-deps

      - name: Build Web Application for Pages
        run: npx vite build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wait for Pages artifact metadata propagation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifacts=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
            count=$(jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' <<< "$artifacts")
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact is available; waiting for metadata to propagate"
              sleep 10
              exit 0
            fi
            echo "Waiting for Pages artifact (attempt ${attempt}/12)..."
            sleep 5
          done
          echo "Timed out waiting for Pages artifact metadata" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
